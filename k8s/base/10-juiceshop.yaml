# Deliberately vulnerable target application (OWASP Juice Shop).
# Lab use only. Never expose this to the public internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juiceshop
  namespace: defense-lab
  labels:
    app: juiceshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juiceshop
  template:
    metadata:
      labels:
        app: juiceshop
    spec:
      containers:
        - name: juiceshop
          image: bkimminich/juice-shop:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: juiceshop
  namespace: defense-lab
  labels:
    app: juiceshop
spec:
  type: ClusterIP
  selector:
    app: juiceshop
  ports:
    - name: http
      port: 3000
      targetPort: 3000
