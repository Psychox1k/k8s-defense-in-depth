# Layer 1: nginx + ModSecurity + OWASP Core Rule Set as a reverse proxy
# in front of the application.
#
# The image is configured through environment variables. Names below were checked against
# the image sources (nginx/Dockerfile in https://github.com/coreruleset/modsecurity-crs-docker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: defense-lab
  labels:
    app: waf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
        - name: waf
          image: owasp/modsecurity-crs:nginx
          ports:
            - containerPort: 8080
          env:
            # Port nginx listens on and the backend it proxies to
            - name: PORT
              value: "8080"
            - name: BACKEND
              value: "http://juiceshop:3000"
            # WAF behaviour: On = block, DetectionOnly = log only
            - name: MODSEC_RULE_ENGINE
              value: "On"
            # CRS paranoia: the level that decides what is blocked, and the level whose
            # rules are evaluated. (The older PARANOIA variable sets both and is deprecated.)
            - name: BLOCKING_PARANOIA
              value: "1"
            - name: DETECTION_PARANOIA
              value: "1"
            # Anomaly score thresholds (CRS defaults)
            - name: ANOMALY_INBOUND
              value: "5"
            - name: ANOMALY_OUTBOUND
              value: "4"
            # Audit log to stdout so `kubectl logs` shows the matched rules.
            # RelevantOnly logs requests with a matched rule or a 4xx/5xx response status.
            - name: MODSEC_AUDIT_ENGINE
              value: "RelevantOnly"
            - name: MODSEC_AUDIT_LOG
              value: "/dev/stdout"
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # Our exclusions replace the image's empty example file
            - name: exclusions
              mountPath: /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
              subPath: REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
              readOnly: true
            # nginx rate limiting, picked up by `include /etc/nginx/conf.d/*.conf`
            - name: rate-limit
              mountPath: /etc/nginx/conf.d/rate-limit.conf
              subPath: rate-limit.conf
              readOnly: true
      volumes:
        - name: exclusions
          configMap:
            name: waf-exclusions
        - name: rate-limit
          configMap:
            name: waf-rate-limit
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: defense-lab
  labels:
    app: waf
spec:
  # k3d maps host port 8080 to port 80 of this LoadBalancer
  type: LoadBalancer
  selector:
    app: waf
  ports:
    - name: http
      port: 80
      targetPort: 8080