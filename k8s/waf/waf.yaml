# Layer 1: nginx + ModSecurity + OWASP Core Rule Set as a reverse proxy
# in front of the application.
#
# The image is configured through environment variables, see
# https://github.com/coreruleset/modsecurity-crs-docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: defense-lab
  labels:
    app: waf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf
  template:
    metadata:
      labels:
        app: waf
    spec:
      containers:
        - name: waf
          image: owasp/modsecurity-crs:nginx
          ports:
            - containerPort: 8080
          env:
            # nginx as reverse proxy to the backend
            - name: PROXY
              value: "1"
            - name: PORT
              value: "8080"
            - name: BACKEND
              value: "http://juiceshop:3000"
            # WAF behaviour: On = block, DetectionOnly = log only
            - name: MODSEC_RULE_ENGINE
              value: "On"
            # CRS tuning: paranoia level 1 and default anomaly thresholds
            - name: PARANOIA
              value: "1"
            - name: BLOCKING_PARANOIA
              value: "1"
            - name: ANOMALY_INBOUND
              value: "5"
            - name: ANOMALY_OUTBOUND
              value: "4"
            # Audit log to stdout so `kubectl logs` shows the matched rules
            - name: MODSEC_AUDIT_ENGINE
              value: "RelevantOnly"
            - name: MODSEC_AUDIT_LOG
              value: "/dev/stdout"
            - name: MODSEC_AUDIT_LOG_FORMAT
              value: "JSON"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: defense-lab
  labels:
    app: waf
spec:
  # k3d maps host port 8080 to port 80 of this LoadBalancer
  type: LoadBalancer
  selector:
    app: waf
  ports:
    - name: http
      port: 80
      targetPort: 8080
